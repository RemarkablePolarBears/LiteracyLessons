<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <title>到底幾頭熊？APA 及文獻工作坊 - TAECT 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .header .subtitle {
            font-size: 1.3em;
            opacity: 0.95;
            margin-bottom: 10px;
        }
        
        .header .info {
            font-size: 1.1em;
            opacity: 0.9;
            margin-top: 15px;
        }
        
        .content {
            padding: 40px;
        }
        
        .info-box {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 8px;
        }
        
        .info-box h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .info-box p {
            line-height: 1.8;
            color: #555;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .view-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin: 40px 0;
        }
        
        .option-card {
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            padding: 35px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .option-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }
        
        .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .option-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.6em;
        }
        
        .option-card p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 1.05em;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 45px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.15em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        .footer {
            text-align: center;
            padding: 30px;
            background: #f8f9fa;
            color: #666;
            font-size: 0.95em;
        }
        
        @media (max-width: 768px) {
            .view-options {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .header .subtitle {
                font-size: 1.1em;
            }
            
            .content {
                padding: 25px;
            }
        }
    </style>
</head>

            </div>
        </div>
        
        <div class="footer">
