<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>到底幾頭熊？APA 及文獻工作坊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #fef3dc;
            padding: 30px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.8em;
            margin-bottom: 10px;
            color: #333;
        }
        
        .header p {
            font-size: 1em;
            color: #333;
            margin: 5px 0;
        }
        
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 600px;
            width: 100%;
        }
        
        .option {
            text-align: center;
        }
        
        .option a {
            display: block;
            text-decoration: none;
            color: #333;
        }
        
        .icon {
            font-size: 100px;
            margin-bottom: 20px;
        }
        
        .option h2 {
            font-size: 1.8em;
            color: #333;
            font-weight: bold;
        }
        
        @media (max-width: 400px) {
            .header {
                padding: 20px 15px;
            }
            
            .header h1 {
                font-size: 1.3em;
            }
            
            .header p {
                font-size: 0.8em;
            }
            
            .content {
                padding: 15px;
            }
            
            .options {
                gap: 20px;
            }
            
            .icon {
                font-size: 70px;
                margin-bottom: 15px;
            }
            
            .option h2 {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐻 到底幾頭熊？</h1>
        <p>APA 及文獻工作坊 概念圖</p>
        <p>TAECT 2025 教案競賽成果發表 (2.2)</p>
        <p>吳宜倫 / 國立陽明交通大學教育研究所博士生</p>
        <p>指導老師：周倩教授</p>
        <p>📅 2025年12月6日（六）B307</p>
    </div>
    
    <div class="content">
        <div class="options">
            <div class="option">
                <a href="https://remarkablepolarbears.github.io/LiteracyLessons/TAECT2025BearsforAPA7.html" target="_blank">
                    <div class="icon">💻</div>
                    <h2>互動式<br>HTML</h2>
                </a>
            </div>
            
            <div class="option">
                <a href="https://remarkablepolarbears.github.io/LiteracyLessons/TAECT2025BearsforAPA7.png" target="_blank">
                    <div class="icon">🖼️</div>
                    <h2>圖片 PNG</h2>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
